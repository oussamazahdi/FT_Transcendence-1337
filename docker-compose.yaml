volumes:
  sqlite_database:

networks:
  transcendence:
    driver: bridge
  
services:

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - sqlite_database:/app/database
    env_file:
      - .env
    networks:
      - transcendence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - transcendence
    restart: unless-stopped

